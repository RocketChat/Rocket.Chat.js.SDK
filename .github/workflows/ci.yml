name: CI

on:
  pull_request:
  push:
    branches: [mobile]

# The two triggers do not overlap: every branch is covered by its pull request,
# and `mobile` by the push. A new commit supersedes the run it replaces, so a
# stale run does not sit in the queue. On `mobile`, every commit keeps its own
# result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'mobile' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # After typecheck: a type error is the cheaper failure to read. Coverage is
      # deliberately not collected here — it is a local tool, not a gate.
      - run: npm test
